name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -v -count=1 -race
      - name: Integration tests
        run: go test -tags=integration ./...
      - name: Extract sk8s logs
        run: |
          set -eu -o pipefail

          mkdir sk8s_out
          docker volume ls -q | grep sk8s-out | xargs -I @ sh -c 'docker run --rm -v @:/data alpine tar -C /data -cf - . > sk8s_out/@.tar'

      - name: Upload sk8s logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.0
        with:
          name: sk8s_logs
          path: sk8s_out
